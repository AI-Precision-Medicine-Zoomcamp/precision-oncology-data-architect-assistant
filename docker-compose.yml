services:
  api:
    build:
      context: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      FHIR_BUNDLES_DIR: /app/data/fhir_examples
      CHROMA_PERSIST_DIR: /app/data/chroma_db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ui:
    build:
      context: .
    command: streamlit run app/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    env_file:
      - path: .env
        required: false
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
